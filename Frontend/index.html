<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>TaskFlow</h1>
        <p class="subtitle" id="todayLabel"></p>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">🌙</button>
    </header>

    <section class="stats" aria-label="Task statistics">
      <div class="stat"><span id="statTotal">0</span><small>Total</small></div>
      <div class="stat"><span id="statActive">0</span><small>Active</small></div>
      <div class="stat"><span id="statDone">0</span><small>Done</small></div>
      <div class="stat"><span id="statOverdue">0</span><small>Overdue</small></div>
    </section>

    <div class="progress" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

    <form id="taskForm" class="task-form" autocomplete="off">
      <input type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="120" required />
      <div class="form-row">
        <select id="taskPriority" aria-label="Priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
        <select id="taskCategory" aria-label="Category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="taskDue" aria-label="Due date" />
        <button type="submit" class="btn primary" id="submitBtn">Add Task</button>
      </div>
      <button type="button" class="btn ghost hidden" id="cancelEdit">Cancel editing</button>
    </form>

    <section class="toolbar">
      <input type="search" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks" />
      <select id="sortSelect" aria-label="Sort tasks">
        <option value="created">Newest first</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
        <option value="title">Title (A–Z)</option>
      </select>
    </section>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </nav>

    <ul id="taskList" class="task-list"></ul>

    <div id="emptyState" class="empty hidden">
      <div class="empty-icon">📝</div>
      <p>No tasks to show. Add one above!</p>
    </div>

    <footer class="app-footer">
      <span id="itemsLeft">0 items left</span>
      <button id="clearCompleted" class="btn ghost small">Clear completed</button>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
